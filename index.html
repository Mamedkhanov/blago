<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Благо</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="screen" class="screen" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" hidden>
    <button class="tab" data-tab="home" aria-label="Главная">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Главная</span>
    </button>
    <button class="tab" data-tab="circle" aria-label="Круг">
      <svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3.2"/><circle cx="16.5" cy="9" r="3.2"/><path d="M2.5 19c.6-3 2.8-4.8 5.5-4.8s4.9 1.8 5.5 4.8M11 19c.6-3 2.8-4.8 5.5-4.8S21.4 16 22 19"/></svg>
      <span>Круг</span>
    </button>
    <button class="tab tab-add" data-tab="add" aria-label="Отметить">
      <span class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
    </button>
    <button class="tab" data-tab="checks" aria-label="Проверки">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>
      <span>Проверки</span>
      <b class="badge" id="checks-badge" hidden></b>
    </button>
    <button class="tab" data-tab="me" aria-label="Я">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4 20.5c1-4 4.2-6 8-6s7 2 8 6"/></svg>
      <span>Я</span>
    </button>
  </nav>

  <div class="sheet" id="sheet" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="add.js"></script>
  <script src="quest.js"></script>
  <script src="library.js"></script>
  <script>start();</script>
</body>
</html>
